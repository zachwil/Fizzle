<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drakkenheim DM Login</title><link rel="stylesheet" href="/portal.css"></head><body><div class="mist"></div><header class="portal-head"><div class="sigil" style="width:48px;height:54px;flex:none"><img src="/cthulhu-mark.svg" alt="" style="display:block;width:100%;height:100%"></div><div><p>THE INNER SANCTUM</p><h1>DRAKKENHEIM</h1><span>Dungeon Master Access</span></div></header><main><section class="gate panel"><p class="eyebrow">RESTRICTED ARCHIVE</p><h2>Dungeon Master Login</h2><p>Enter the credentials configured for this campaign.</p><form id="dm-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><p class="error" id="error"></p><button>Enter the Archive</button></form></section></main><script>document.querySelector('#dm-form').onsubmit=async e=>{e.preventDefault();let error=document.querySelector('#error');error.textContent='';let r=await fetch('/api/dm/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();if(r.ok)location.href='/dashboard';else error.textContent=d.error||'Login failed'};fetch('/api/dm/me').then(r=>{if(r.ok)location.href='/dashboard'})</script></body></html>
