<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fizzle Table Display</title><link rel="stylesheet" href="/display.css"></head><body>
<div class="display-mist"></div><main>
<section id="display-login" class="display-login"><img src="/cthulhu-mark.svg" alt=""><p class="eyebrow">FIZZLE TABLE DISPLAY</p><h1>Enter the Scrying Glass</h1><form id="display-login-form"><label>Dashboard Username<input name="username" value="dashboard" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><p id="display-error"></p><button>Open Display</button></form></section>
<section id="table-display" class="table-display hidden"><header><div><p class="eyebrow">ENCOUNTER STATUS</p><h1>Initiative Order</h1></div><div id="display-round" class="display-round">ROUND 1</div></header><div class="display-grid"><section id="display-initiative" class="display-initiative"></section><aside><section id="display-message-card" class="display-message-card hidden"><p class="eyebrow">MESSAGE FROM THE DUNGEON MASTER</p><div id="display-message"></div></section><section id="display-image-card" class="display-image-card hidden"><img id="display-image" alt="Shared by the Dungeon Master"></section></aside></div><button id="display-logout" class="display-logout">Leave Display</button></section>
</main><script src="/display.js"></script></body></html>
